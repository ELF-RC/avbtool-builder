name: Build avbtool-mod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            builder: pyinstaller
          - arch: arm64
            runner: ubuntu-22.04-arm
            builder: pyinstaller
          - arch: amd64
            runner: ubuntu-22.04
            builder: nuitka
          - arch: arm64
            runner: ubuntu-22.04-arm
            builder: nuitka

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache patchelf zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.builder }}" = "pyinstaller" ]; then
            python -m pip install pyinstaller cryptography
          else
            python -m pip install nuitka ordered-set zstandard cryptography
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(python -c 'text=open("avbtool.py", encoding="utf-8").read().splitlines(); names=("MAJOR", "MINOR", "SUB"); print(".".join(next(line.split("=", 1)[1].strip() for line in text if line.startswith("AVB_VERSION_%s = " % name)) for name in names))')"
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          NAME="avbtool-mod-${VERSION}-${{ matrix.arch }}-${{ matrix.builder }}-${DATE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        if: matrix.builder == 'pyinstaller'
        run: |
          mkdir -p build_logs
          python -m PyInstaller \
            --clean \
            --onefile \
            --name avbtool \
            --collect-all cryptography \
            avbtool.py > build_logs/build_out.log 2>&1

      - name: Build with Nuitka
        if: matrix.builder == 'nuitka'
        run: |
          set -o pipefail
          mkdir -p build_logs
          python -m nuitka \
            --standalone \
            --onefile \
            --output-filename=avbtool \
            --output-dir=.avbtool-dist \
            --include-package=cryptography \
            --assume-yes-for-downloads \
            --verbose \
            --verbose-output=build_logs/nuitka-build.log \
            --onefile-no-compression \
            --static-libpython=yes \
            avbtool.py > build_logs/nuitka-stdout.log 2>&1

      - name: Package build logs
        if: always()
        run: |
          mkdir -p logs
          {
            echo "=== Workflow Environment ==="
            echo "Date: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Runner: ${{ matrix.runner }}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Builder: ${{ matrix.builder }}"
            echo ""
            echo "=== System Info ==="
            uname -a
            echo ""
            echo "=== Python Version ==="
            python --version
          } > logs/workflow-env.log

          if [ "${{ matrix.builder }}" = "nuitka" ]; then
            python -m nuitka --version > logs/nuitka-version.log 2>&1 || true
          else
            python -m PyInstaller --version > logs/pyinstaller-version.log 2>&1 || true
          fi

          mkdir -p build_logs .avbtool-dist dist
          find build_logs .avbtool-dist dist -type f \
            \( -name '*.log' -o -name '*.txt' -o -name '*.toc' -o -name '*.warnings' \) \
            -exec cp --parents {} logs/ \;

          zip -r "${{ steps.meta.outputs.name }}-logs.zip" logs

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-logs
          path: ${{ steps.meta.outputs.name }}-logs.zip
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30

      - name: Package avbtool
        run: |
          if [ "${{ matrix.builder }}" = "pyinstaller" ]; then
            BIN="dist/avbtool"
          else
            BIN=".avbtool-dist/avbtool"
          fi
          install -m 755 "$BIN" "avbtool-${{ steps.meta.outputs.version }}-${{ matrix.arch }}"

      - name: Upload avbtool
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: avbtool-${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30